name: generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hussein-Furaty
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2322D3EE&color_dots=%232d3343,%230891B2,%2322D3EE,%23A78BFA,%2310B981
            dist/github-contribution-grid-snake.svg?color_snake=%230891B2&color_dots=%23ebedf0,%23A78BFA,%2322D3EE,%230891B2,%2310B981

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
